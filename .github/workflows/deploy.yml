name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAMLTD-XId11R7Wl32rKNbCXPeAvXiWiFQ
          VITE_FIREBASE_AUTH_DOMAIN: bookcollection-3a5c6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: bookcollection-3a5c6
          VITE_FIREBASE_STORAGE_BUCKET: bookcollection-3a5c6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "76956591584"
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          VITE_FIREBASE_APP_ID: 1:76956591584:web:d119e101fa1b0c644b3785

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + règles Firestore
        run: npx --yes firebase-tools@latest deploy --project bookcollection-3a5c6 --only hosting,firestore --non-interactive
